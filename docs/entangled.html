
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crucible Terminal</title>
  <script type="module" crossorigin src="/crucible-rhythm/assets/entangled-QIo80kQN.js"></script>

<body>
  <main class="terminal">
    <header>
      <span>CRUCIBLE_OS // v0.9.1</span>

    <section class="boot">
      <p>&gt; INITIALIZING CONTAINMENT...</p>

      <div id="turns">03</div>

    </section>

    <footer>
      <span id="system-status">SYS.STATUS: LOCKED</span>
      <span>█ █ █ ░ ░</span>
    </footer>
  </main>
